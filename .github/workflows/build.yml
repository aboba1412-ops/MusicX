name: Build MusicX APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack project
        run: |
          mkdir project
          unzip -q *.zip -d project
          FILE=$(find project \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          test -n "$FILE"
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MusicX-apk
          path: project/**/build/outputs/apk/debug/*.apk
